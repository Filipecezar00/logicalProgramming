<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ex20</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h2>Cadastrar Novo Processo</h2>
    <form id="formProcesso">
      <input type="text" id="numero" placeholder="Número do Processo" />
      <input type="text" id="cliente" placeholder="Nome do Cliente" />
      <input type="number" id="valor" placeholder="Valor da Causa" />
      <button type="submit" id="btn_cadastrar">Cadastrar Processo</button>
    </form>

    <p id="mensagem"></p>

    <hr />

    <h2>Ações do painel</h2>
    <button id="btn_filtrar">Ver causas > R$2.000</button>
    <button id="btn_ordenar">Ordenar por Maior valor</button>
    <button id="btn_urgencia">Verificar Alerta de Urgência</button>

    <h2>Lista de processos</h2>
    <div id="containerProcessos"></div>
  </body>
  <script src="index.js"></script>
</html>
