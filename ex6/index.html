<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logical Programming</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h1 id="title">DASHBOARD DE FINANÇAS</h1>
    <div id="container">
      <form id="form1">
        <label for="despesas">Despesa</label>
        <input type="text" id="despesas" placeholder="Registrar Despesa" />
        <label for="valor">Valor</label>
        <input type="number" id="valor" placeholder="Registrar valor" />
        <button type="button" id="btn_adicionar">Adicionar Despesas</button>
      </form>
      <form id="form2">
        <label for="produto">Produto:</label>
        <input type="text" id="produto" placeholder="Registrar Produto" />
        <label for="quantidade">Quantidade:</label>
        <input
          type="number"
          id="quantidade"
          placeholder="Registrar Quantidade"
        />
        <label for="preco_custo">Preço de Custo:</label>
        <input type="number" id="preco_custo" placeholder="preco de custo" />
        <label for="preco_venda">Preço de Venda:</label>
        <input type="number" id="preco_venda" placeholder="preço de venda" />
        <button type="button" id="btn_registrar">Registrar Venda</button>
      </form>
    </div>
    <div id="resps">
      <div id="resp_despesa"></div>
      <div id="resp_produto"></div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
