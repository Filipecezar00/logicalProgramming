<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ex18</title>
  </head>
  <link rel="stylesheet" href="index.css" />
  <body>
    <section id="container_form">
      <header id="cabecalho">
        <h2>Formulário de cadastro de Processos</h2>
      </header>
      <form action="" class="formCadastro">
        <label for="numeroProcesso">Número do Processo:</label>
        <input type="text" id="numeroProcesso" required />
        <label for="numeroCliente">Número do Cliente:</label>
        <input type="text" id="numeroCliente" required />
        <label for="valorCausa">Valor da Causa:</label>
        <input type="number" id="valorCausa" required />

        <button id="btn_cadastro">Enviar Cadastro</button>
      </form>
    </section>
    <div id="mensagem"></div>
    <script src="index.js"></script>
  </body>
</html>
