<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ex21</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <form id="formFoto">
      <label for="inputFoto">Escolha sua foto de perfil:</label> <br />
      <input type="file" id="inputFoto" accept="image/*" />

      <div id="containerPreview" style="margin-top: 15px">
        <img
          alt="Preview"
          id="imgPreview"
          style="max-width: 200px; display: none; border-radius: 8px"
        />
      </div>

      <button type="submit" style="margin-top: 15px" id="btn_enviar">
        Enviar para o Servidor
      </button>
    </form>
    <div id="mensagem" style="margin-top: 15px"></div>
    <script src="index.js"></script>
  </body>
</html>
